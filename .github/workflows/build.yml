
name: Build MythicToolsy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Plugin
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Build MythicToolsy
        run: gradle build

      - name: Upload Plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: MythicToolsy-JAR
          path: build/libs/MythicToolsy*.jar
          
